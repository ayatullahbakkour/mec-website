<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Middle East Contracting (MEC) | الشرق الأوسط للمقاولات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap">
<style>
:root{--navy:#0b1f3f;--navy2:#071429;--gold:#c2a050;--gold2:#e0c47f;--bg:#f4f6f9;--card:#fff;--ink:#16223a;--slate:#5b6676;--line:#dde2ea;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1528;--card:#102039;--ink:#e8ecf3;--slate:#9aa6b8;--line:#22344f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1528;--card:#102039;--ink:#e8ecf3;--slate:#9aa6b8;--line:#22344f;color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 Cairo,system-ui,sans-serif}
h1,h2,h3{font-family:Amiri,Cairo,serif;line-height:1.25;margin:0}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
section{padding:84px 0}
h2{font-size:clamp(30px,4vw,44px);color:var(--ink)}
.lead{color:var(--slate);max-width:62ch;margin:10px 0 40px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:3px;padding:13px 26px;font:600 15px Cairo,sans-serif;cursor:pointer;text-decoration:none;transition:.2s}
.btn.gold{background:var(--gold);color:#1a1405}.btn.gold:hover{background:var(--gold2)}
.btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45)}.btn.ghost:hover{border-color:var(--gold2);color:var(--gold2)}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
/* nav */
header{position:fixed;inset:0 0 auto 0;z-index:50;padding-top:env(safe-area-inset-top,0px);background:rgba(7,20,41,.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(194,160,80,.3)}
.bar{display:flex;align-items:center;gap:20px;height:72px}
.brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;margin-inline-end:auto}
.brand b{font:700 21px Amiri,serif;display:block;line-height:1.1}.brand small{color:var(--gold2);font-size:12px}
nav{display:flex;gap:26px}
nav a{color:#d6dde9;text-decoration:none;font-size:15px;padding:4px 0;border-bottom:2px solid transparent}
nav a:hover{color:var(--gold2);border-color:var(--gold)}
.tools{display:flex;gap:8px}
.chip{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:3px;padding:6px 12px;font:600 13px Cairo;cursor:pointer}
.chip:hover{border-color:var(--gold2)}
.burger{display:none}
@media(max-width:900px){.burger{display:block}
nav{display:none;position:absolute;top:100%;inset-inline:0;background:var(--navy2);flex-direction:column;padding:12px 20px 20px;gap:4px}
nav.open{display:flex}nav a{padding:10px 0}}
/* hero */
.hero{position:relative;min-height:100vh;display:flex;align-items:center;color:#fff;overflow:hidden;padding:120px 0 80px;background:var(--navy2)}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.6s}
.slide.on{opacity:1}
.slide svg{position:absolute;inset-inline:0;bottom:0;width:100%;height:58%}
.s1{background:linear-gradient(180deg,#050d1c,#0b2352 60%,#123a78)}
.s2{background:linear-gradient(180deg,#0a1226,#2a2a4a 55%,#8a5e3c)}
.s3{background:linear-gradient(180deg,#06182b,#0d3b52 60%,#1c6b7a)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,20,41,.85),rgba(7,20,41,.25))}
[dir=rtl] .hero::after{background:linear-gradient(270deg,rgba(7,20,41,.85),rgba(7,20,41,.25))}
.hero .wrap{position:relative;z-index:2;display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(38px,6vw,72px);font-weight:700}
.hero p{font-size:18px;color:#cfd8e6;max-width:52ch;margin:18px 0 32px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.emblem{border-radius:50%;width:min(100%,400px);aspect-ratio:1;object-fit:cover;object-position:48% 46%;transform:scale(1);justify-self:center;border:2px solid var(--gold);box-shadow:0 0 0 10px rgba(194,160,80,.12),0 30px 80px rgba(0,0,0,.5)}
.dots{position:absolute;z-index:3;bottom:28px;inset-inline:0;display:flex;justify-content:center;gap:10px}
.dots button{width:34px;height:4px;border:0;background:rgba(255,255,255,.35);cursor:pointer;padding:0}
.dots button.on{background:var(--gold2)}
@media(max-width:800px){.hero .wrap{grid-template-columns:1fr}.emblem{width:220px;order:-1}}
@media(prefers-reduced-motion:reduce){.slide{transition:none}html{scroll-behavior:auto}}
/* about */
.about{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.about img{width:100%;border-radius:4px;border:1px solid var(--line)}
.vm{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}
.vm div{background:var(--card);border-inline-start:3px solid var(--gold);padding:18px 20px}
.vm h3{font-size:22px;margin-bottom:4px}.vm p{margin:0;color:var(--slate);font-size:15px}
.facts{display:flex;gap:30px;margin-top:26px;flex-wrap:wrap}
.facts b{font:700 34px Amiri,serif;color:var(--gold);display:block;line-height:1}
.facts span{color:var(--slate);font-size:14px}
@media(max-width:800px){.about,.vm{grid-template-columns:1fr}}
/* services */
.band{background:var(--navy);color:#fff}
.band h2{color:#fff}.band .lead{color:#b8c3d6}
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(194,160,80,.28);padding:26px 22px;text-align:start;color:#fff;cursor:pointer;font:inherit;transition:.25s;border-radius:4px}
.card:hover,.card[aria-expanded=true]{background:rgba(194,160,80,.14);border-color:var(--gold2);transform:translateY(-4px)}
.card svg{width:40px;height:40px;stroke:var(--gold2);fill:none;stroke-width:1.6;margin-bottom:14px}
.card h3{font-size:24px;margin-bottom:6px}
.card p{margin:0;color:#c3cddd;font-size:14.5px}
.card .more{display:none;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.18);font-size:14px;color:#e5eaf3}
.card[aria-expanded=true] .more{display:block}
.card .more ul{margin:0;padding-inline-start:18px}
/* portfolio */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.filters button{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:8px 18px;border-radius:30px;font:600 14px Cairo;cursor:pointer}
.filters button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.proj{background:var(--card);border:1px solid var(--line);overflow:hidden;border-radius:4px}
.proj .art{height:170px;position:relative;display:flex;align-items:flex-end}
.proj .art svg{width:100%;height:100%}
.proj .info{padding:16px 18px 18px}
.proj h3{font-size:22px}.proj p{margin:2px 0 0;color:var(--slate);font-size:14px}
.tag{display:inline-block;font-size:12px;color:var(--gold);border:1px solid var(--gold);border-radius:20px;padding:0 10px;margin-bottom:8px}
/* contact */
.contact{display:grid;grid-template-columns:.8fr 1.2fr;gap:44px}
.info-list{list-style:none;padding:0;margin:24px 0 0;display:grid;gap:14px;color:var(--slate)}
.info-list b{color:var(--ink);display:block}
.panel{background:var(--card);border:1px solid var(--line);padding:30px;border-radius:4px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:22px}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:12px;font:700 15px Cairo;color:var(--slate);cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--gold)}
.steps{display:flex;gap:6px;margin-bottom:22px}
.steps i{flex:1;height:5px;background:var(--line);border-radius:3px}.steps i.on{background:var(--gold)}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 5px}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:100px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{border:1px solid var(--line);padding:12px 14px;border-radius:3px;cursor:pointer;background:var(--bg);font:600 14px Cairo;color:var(--ink);text-align:start}
.opt.on{border-color:var(--gold);background:rgba(194,160,80,.16)}
.err{color:#c0392b;font-size:13px;min-height:18px;margin-top:8px}
.nav2{display:flex;justify-content:space-between;margin-top:20px;gap:10px}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.summary{background:var(--bg);padding:14px 16px;border-radius:3px;font-size:14px;display:grid;gap:4px;margin-top:6px}
.ok{text-align:center;padding:30px 10px}
.ok .tick{width:64px;height:64px;border-radius:50%;background:var(--gold);color:#1a1405;font-size:34px;display:grid;place-items:center;margin:0 auto 14px}
.ok code{background:var(--bg);padding:4px 12px;border-radius:3px;font-size:18px;letter-spacing:1px;color:var(--gold)}
@media(max-width:800px){.contact,.two{grid-template-columns:1fr}}
footer{background:var(--navy2);color:#9fb0c8;padding:30px 0 calc(30px + env(safe-area-inset-bottom,0px));font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
</style>
</head>

<section id="services" class="band"><div class="wrap"><h2 data-i="s_title"></h2><p class="lead" data-i="s_sub"></p><div class="svc" id="svc"></div></div></section>

<div><h2 data-i="c_title"></h2><p class="lead" data-i="c_sub" style="margin-bottom:0"></p>
<ul class="info-list"><li><b data-i="c_addr_t"></b><span data-i="c_addr"></span></li><li><b data-i="c_hours_t"></b><span data-i="c_hours"></span></li><li><b data-i="c_note_t"></b><span data-i="c_note"></span></li></ul></div>
<div class="panel">
<div class="tabs" role="tablist"><button id="t_consult" class="on" onclick="openTab('consult')" data-i="t_consult"></button><button id="t_contact" onclick="openTab('contact')" data-i="t_contact"></button></div>

</div></div></section>

proj:["أبراج المزة السكنية","مجمع دمشق للأعمال","حي مرتفعات قاسيون","تطوير الطريق الدائري","مجمع الفيلات الحدائقي","مخطط تجديد المدينة القديمة"]}};
const icons=['<path d="M4 20V8l8-4 8 4v12M9 20v-6h6v6M4 20h16"/>','<circle cx="11" cy="11" r="6"/><path d="M16 16l5 5M9 11l2 2 3-4"/>','<path d="M3 21h18M6 21V9h5v12M13 21V4h5v17M8 12h1M8 15h1M15 8h1M15 11h1"/>','<path d="M4 5h16v10H9l-5 4zM8 9h8M8 12h5"/>','<path d="M3 20l5-9 4 5 3-6 6 10zM3 20h18"/>'];
const projCat=['res','com','urb','inf','res','urb'],cols=[['#123a78','#c2a050'],['#2a2a4a','#e0c47f'],['#0d3b52','#c2a050'],['#334155','#e0c47f'],['#17415f','#c2a050'],['#4a3a2a','#e0c47f']];
let lang='en',cat='all',tab='consult',step=0,data={},svcIdx=null;
const $=s=>document.querySelector(s),L=()=>T[lang];
const store=(k,v)=>{try{const a=JSON.parse(localStorage.getItem(k)||'[]');if(v){a.push(v);localStorage.setItem(k,JSON.stringify(a))}return a}catch(e){return[]}};
function setLang(l){lang=l;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';
$('#lang').textContent=l==='ar'?'EN':'عربي';
document.querySelectorAll('[data-i]').forEach(e=>e.textContent=L()[e.dataset.i]);
renderSvc();renderFilters();renderGrid();renderForms();try{localStorage.setItem('mec-lang',l)}catch(e){}}
$('#lang').onclick=()=>setLang(lang==='en'?'ar':'en');
$('#theme').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};
$('#burger').onclick=()=>$('#nav').classList.toggle('open');
$('#nav').onclick=()=>$('#nav').classList.remove('open');
/* hero slider */
const sl=[...document.querySelectorAll('.slide')],dots=$('#dots');let cur=0,timer;
sl.forEach((_,i)=>{const b=document.createElement('button');b.setAttribute('aria-label','Slide '+(i+1));b.onclick=()=>go(i,true);dots.append(b)});
function go(i,reset){cur=i;sl.forEach((s,k)=>s.classList.toggle('on',k===i));[...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i));if(reset){clearInterval(timer);start()}}
function start(){timer=setInterval(()=>go((cur+1)%sl.length),6000)}go(0);start();
/* services */
function renderSvc(){$('#svc').innerHTML=L().svc.map((s,i)=>`<button class="card" aria-expanded="${svcIdx===i}" data-k="${i}"><svg viewBox="0 0 24 24">${icons[i]}</svg><h3>${s[0]}</h3><p>${s[1]}</p><div class="more"><ul>${s[2].map(x=>`<li>${x}</li>`).join('')}</ul></div></button>`).join('');
document.querySelectorAll('#svc .card').forEach(c=>c.onclick=()=>{const k=+c.dataset.k;svcIdx=svcIdx===k?null:k;document.querySelectorAll('#svc .card').forEach(x=>x.setAttribute('aria-expanded',+x.dataset.k===svcIdx))})}
/* portfolio */
const cats=['all','res','com','urb','inf'],cn={all:'all',res:'c_res',com:'c_com',urb:'c_urb',inf:'c_inf'};
function renderFilters(){$('#filters').innerHTML=cats.map(c=>`<button class="${c===cat?'on':''}" data-c="${c}">${L()[cn[c]]}</button>`).join('');
document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;renderFilters();renderGrid()})}
function renderGrid(){$('#grid').innerHTML=L().proj.map((p,i)=>({p,i})).filter(o=>cat==='all'||projCat[o.i]===cat).map(({p,i})=>{const[c1,c2]=cols[i];
const art=projCat[i]==='urb'?`<path d="M0 120h300M60 40v100M150 60v80M240 30v110M0 90h300" stroke="${c2}" stroke-width="2" opacity=".7" fill="none"/><circle cx="150" cy="80" r="34" fill="none" stroke="${c2}" stroke-width="2"/>`:`<g fill="${c2}" opacity=".9"><rect x="50" y="60" width="40" height="110"/><rect x="100" y="30" width="46" height="140"/><rect x="156" y="80" width="40" height="90"/><rect x="206" y="50" width="44" height="120"/></g><g fill="${c1}"><rect x="58" y="72" width="6" height="8"/><rect x="110" y="44" width="6" height="8"/><rect x="214" y="64" width="6" height="8"/></g>`;
return`<article class="proj"><div class="art" style="background:linear-gradient(160deg,${c1},#050d1c)"><svg viewBox="0 0 300 170" preserveAspectRatio="xMidYMax slice">${art}</svg></div><div class="info"><span class="tag">${L()[cn[projCat[i]]]}</span><h3>${p}</h3><p>Damascus, Syria</p></div></article>`}).join('')}
/* forms */
function openTab(t){tab=t;$('#t_consult').classList.toggle('on',t==='consult');$('#t_contact').classList.toggle('on',t==='contact');$('#consult').hidden=t!=='consult';$('#contactBox').hidden=t!=='contact'}
const val=id=>(document.getElementById(id)||{}).value||'';
const field=(id,l,type='text',extra='')=>`<label for="${id}">${L()[l]}</label><input id="${id}" type="${type}" value="${(data[id]||'').toString().replace(/"/g,'&quot;')}" ${extra}>`;
const sel=(id,l,arr)=>`<label for="${id}">${L()[l]}</label><select id="${id}"><option value=""></option>${arr.map(a=>`<option ${data[id]===a?'selected':''}>${a}</option>`).join('')}</select>`;
function renderForms(){renderConsult();renderContact()}
function renderConsult(){const l=L(),box=$('#consult');
const bar=`<div class="steps">${[0,1,2,3].map(i=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div><p style="margin:0 0 6px;color:var(--slate);font-size:14px">${l['st'+(step+1)]} (${step+1}/4)</p>`;
let body='';
if(step===0)body=`<label>${l.q_service}</label><div class="opts">${l.svc.map((s,i)=>`<button type="button" class="opt ${data.svc===i?'on':''}" data-s="${i}">${s[0]}</button>`).join('')}</div>`;
if(step===1)body=sel('ptype','l_ptype',l.ptypes)+`<div class="two"><div>${field('area','l_area','number','min="0"')}</div><div>${sel('budget','l_budget',l.budgets).replace('<label','<label')}</div></div>`+field('loc','l_loc')+`<label for="desc">${l.l_desc}</label><textarea id="desc">${data.desc||''}</textarea>`;
if(step===2)body=field('name','l_name')+`<div class="two"><div>${field('phone','l_phone','tel')}</div><div>${field('email','l_email','email')}</div></div>`+field('date','l_date','date');
if(step===3)body=`<div class="summary"><div><b>${l.st1}:</b> ${l.svc[data.svc][0]}</div><div><b>${l.l_ptype}:</b> ${data.ptype}</div><div><b>${l.l_loc}:</b> ${data.loc}</div><div><b>${l.l_area}:</b> ${data.area||'—'}</div><div><b>${l.l_budget}:</b> ${data.budget||'—'}</div><div><b>${l.l_name}:</b> ${data.name} · ${data.phone}</div></div>`;
box.innerHTML=bar+body+`<div class="err" id="err" role="alert"></div><div class="nav2"><button type="button" class="btn line" id="bk" ${step?'':'style="visibility:hidden"'}>${l.back}</button><button type="button" class="btn gold" id="nx">${step===3?l.send:l.next}</button></div>`;
box.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{data.svc=+o.dataset.s;renderConsult()});
$('#bk').onclick=()=>{save();step--;renderConsult()};$('#nx').onclick=next}
function save(){['ptype','area','budget','loc','desc','name','phone','email','date'].forEach(k=>{if(document.getElementById(k))data[k]=val(k)})}
const emailOk=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
function next(){save();const l=L();let e='';
if(step===0&&data.svc==null)e=l.e_service;
if(step===1&&(!data.ptype||data.loc.trim().length<2))e=l.e_proj;
if(step===2){if(data.name.trim().length<2||data.phone.replace(/\D/g,'').length<7)e=l.e_cont;else if(!emailOk(data.email))e=l.e_email}
if(e){$('#err').textContent=e;return}
if(step<3){step++;return renderConsult()}
const b=$('#nx');b.disabled=true;b.textContent=l.sending;
mockApi('/api/consultations',{...data,service:T.en.svc[data.svc][0],lang}).then(r=>{
$('#consult').innerHTML=`<div class="ok"><div class="tick">✓</div><h3 style="font-size:28px">${l.ok_t}</h3><p>${l.ok_p}</p><code>${r.ref}</code><div style="margin-top:20px"><button class="btn gold" id="again">${l.again}</button></div></div>`;
$('#again').onclick=()=>{data={};step=0;renderConsult()}})}
function renderContact(){const l=L(),box=$('#contactBox');
box.innerHTML=field('c_name','l_name')+`<div class="two"><div>${field('c_email','l_email','email')}</div><div>${field('c_phone','l_phone','tel')}</div></div><label for="c_msg">${l.l_msg}</label><textarea id="c_msg"></textarea><div class="err" id="cerr" role="alert"></div><div class="nav2"><span></span><button type="button" class="btn gold" id="csend">${l.send2}</button></div>`;
$('#csend').onclick=()=>{const m={name:val('c_name').trim(),email:val('c_email').trim(),phone:val('c_phone').trim(),message:val('c_msg').trim()};
if(m.name.length<2||!emailOk(m.email)||m.message.length<5){$('#cerr').textContent=l.e_msg;return}
$('#csend').disabled=true;$('#csend').textContent=l.sending;
mockApi('/api/contact',m).then(()=>{box.innerHTML=`<div class="ok"><div class="tick">✓</div><p>${l.ok2}</p></div>`;setTimeout(renderContact,4000)})}}
/* mock backend: simulated POST, persisted to localStorage */
function mockApi(route,payload){return new Promise(res=>setTimeout(()=>{
const ref='MEC-'+Date.now().toString(36).toUpperCase().slice(-6);
store(route.includes('consult')?'mec-consultations':'mec-messages',{ref,...payload,at:new Date().toISOString()});
res({ok:true,status:201,ref})},900))}
let saved='en';try{saved=localStorage.getItem('mec-lang')||((navigator.language||'').startsWith('ar')?'ar':'en')}catch(e){}
document.querySelectorAll('[data-logo]').forEach(i=>i.src=LOGO);openTab('consult');setLang(saved==='ar'?'ar':'en');
</script>
</body>
</html>
